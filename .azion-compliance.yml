exceptions:
  - check: semver
    action: waive
    until: 2027-05-31
    reason: 'monorepo of four npm packages; release-please tags each one <package>@x.y.z (for example @aziontech/webkit@6.0.0), and every version inside the tag is SemVer'
  - check: changelog
    action: waive
    until: 2027-05-31
    reason: 'monorepo; release-please writes one CHANGELOG.md per package (packages/webkit, theme and icons today, webkit-mcp from its first release) with version headers, and the GitHub Release notes'
