# Rules for actions/dependency-review-action in .github/workflows/security.yml.
# A pull request may not add or change a dependency that has a known vulnerability of high or
# critical severity, or whose license is not on this list. Adding a license is a reviewed change
# to this file.
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown
license-check: true
vulnerability-check: true
comment-summary-in-pr: never
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - MPL-2.0
  - OFL-1.1
  - PSF-2.0
  - Python-2.0
  - Unlicense
  - Zlib
# Named exceptions. The Claude Code CLI is installed only by usage-check.yml
# (.github/tools/usage-check) to run the agent usage check; it is never shipped in a package.
allow-dependencies-licenses:
  - pkg:npm/%40anthropic-ai/claude-code
  - pkg:npm/%40anthropic-ai/claude-code-darwin-arm64
  - pkg:npm/%40anthropic-ai/claude-code-darwin-x64
  - pkg:npm/%40anthropic-ai/claude-code-linux-arm64
  - pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl
  - pkg:npm/%40anthropic-ai/claude-code-linux-x64
  - pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl
  - pkg:npm/%40anthropic-ai/claude-code-win32-arm64
  - pkg:npm/%40anthropic-ai/claude-code-win32-x64
