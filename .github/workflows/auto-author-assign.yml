name: Auto Author Assign
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Author Assign
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type || github.event.issue.user.type }}
        run: |
          # Replaces technote-space/assign-author (unmaintained, SO-5131). Bots are skipped, as before.
          if [ "$AUTHOR_TYPE" = "Bot" ]; then exit 0; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/assignees" -f "assignees[]=${AUTHOR}" --silent
