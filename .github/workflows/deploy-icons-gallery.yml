name: Deploy icons gallery

on:
  push:
    branches:
      - main
    paths:
      - 'apps/icons-gallery/**'
      - 'packages/icons/**'

permissions: {}

# Never run two deploys at once; a queued run is replaced by a newer one,
# and an in-flight azion deploy is never cancelled mid-way.
concurrency:
  group: deploy-icons-gallery
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Azion CLI (pinned release, checksum verified)
        env:
          AZION_CLI_VERSION: 4.26.2
          AZION_CLI_SHA256: 16c8152b2fcbaacca0ae00c538355675259a2f5df7faecff56c9eeb79be7d672
        run: |
          zip="$RUNNER_TEMP/azion.zip"
          curl -fsSL -o "$zip" "https://github.com/aziontech/azion/releases/download/${AZION_CLI_VERSION}/azion_${AZION_CLI_VERSION}_linux_amd64.zip"
          echo "${AZION_CLI_SHA256}  $zip" | sha256sum -c -
          unzip -q -o "$zip" azion -d "$RUNNER_TEMP/azion-cli"
          sudo install -m 0755 "$RUNNER_TEMP/azion-cli/azion" /usr/local/bin/azion

      - name: Show the Azion CLI version
        run: azion --version

      - name: Configure token
        env:
          AZION_PERSONAL_TOKEN: ${{ secrets.AZION_PERSONAL_TOKEN }}
        run: |
          azion -t "$AZION_PERSONAL_TOKEN"
          azion whoami

      - name: Build @aziontech/icons
        run: |
          npm run build:icons

      - name: Build with Azion
        run: |
          npm run build:icons-gallery:azion

      - name: Deploy with Azion
        run: |
          npm run deploy:icons-gallery
