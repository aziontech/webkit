name: Governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same PR (a new push obsoletes the old run's
# 8 Playwright-sharded jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      webkit: ${{ steps.filter.outputs.webkit }}
      tests: ${{ steps.filter.outputs.tests }}
      visual: ${{ steps.filter.outputs.visual }}
      baselines: ${{ steps.filter.outputs.baselines }}
      canary: ${{ steps.filter.outputs.canary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            webkit:
              - 'packages/webkit/**'
              - 'packages/webkit-mcp/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.syncpackrc.json'
            tests:
              - 'packages/webkit/**'
            visual:
              - 'packages/webkit/**'
              - 'packages/theme/**'
              - 'packages/icons/**'
              - 'apps/docs/**'
              - 'apps/demos/**'
              - 'apps/visual/**'
              - 'pnpm-lock.yaml'
            baselines:
              - 'apps/visual/baselines/**'
            canary:
              - 'packages/webkit/**'
              - 'lint-canaries/**'
              - 'eslint.config.js'
              - 'commitlint.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.stylelintrc.json'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.github/workflows/governance.yml'

      - name: Install actionlint and zizmor (pinned release binaries, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          bin="$RUNNER_TEMP/workflow-linters"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$bin" zizmor
          echo "$bin" >> "$GITHUB_PATH"

      - name: Lint the workflows (actionlint, zizmor)
        run: npm run check:workflows

  security:
    name: Security scans
    needs: changes
    if: needs.changes.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run check:audit

      - name: Run TruffleHog (secret detection)
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      - name: Check unused files, exports and dependencies
        run: pnpm run check:unused

      - name: Check every package uses one version of each shared dependency and the lockfile has no duplicate
        run: pnpm run check:versions

  security-suite:
    name: Security suite
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: write

  code-scanning:
    name: Publish the Semgrep findings to code scanning
    needs: security-suite
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download the Semgrep SARIF file
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sarif-semgrep
          path: sarif

      - name: Upload Semgrep
        if: hashFiles('sarif/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/semgrep.sarif
          category: semgrep

  lint-canaries:
    name: Lint canaries (broken samples must stay broken)
    needs: changes
    if: needs.changes.outputs.canary == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint canaries (every fixture must still fail its rule)
        run: node lint-canaries/index.js

  lint:
    name: Lint and format
    needs: changes
    if: needs.changes.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (zero warnings policy)
        run: pnpm run lint:webkit

      - name: Quality lint — no line over 200 characters and the full accessibility lint in components, blocks and examples (no baseline)
        run: pnpm --filter @aziontech/webkit run lint:quality

      - name: Run Stylelint
        run: pnpm run lint:webkit:style

      - name: Prettier check (fail on diff)
        run: pnpm run check:webkit:format

  types:
    name: Types and type coverage
    needs: changes
    if: needs.changes.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the icon font
        run: pnpm build:icons

      - name: TypeScript check
        run: pnpm run typecheck:webkit

      - name: Tests TypeScript check
        run: pnpm run typecheck:webkit:tests

      - name: Docs site TypeScript check
        run: pnpm run typecheck:docs

      - name: Type coverage (enforce 95% threshold)
        run: pnpm run check:webkit:type-coverage

      - name: SFC type coverage — the any count in component SFCs does not grow
        run: pnpm --filter @aziontech/webkit run check:sfc-type-coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint, types]
    if: needs.changes.outputs.webkit == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert no test files leak into the tarball
        run: pnpm check:pack
        working-directory: packages/webkit

      - name: Build the icon font
        run: pnpm build:icons

      - name: Bundle budget
        run: pnpm run check:size
        working-directory: packages/webkit

      - name: Package lint — publint on the packed theme, icons and webkit, arethetypeswrong on theme (esm-only) and icons
        run: pnpm --filter @aziontech/webkit run check:package-lint

  site:
    name: Build docs site and demos
    runs-on: ubuntu-latest
    needs: [changes, lint, types]
    if: needs.changes.outputs.visual == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the docs site (every route prerendered)
        env:
          DOCS_SOURCE_REF: ${{ github.event.pull_request.head.sha }}
        run: pnpm build:docs

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/docs

      - name: Docs smoke test — every route loads without a console error, axe in light and dark finds no violation
        run: pnpm test:docs:smoke

      - name: Docs shell test — landmarks, focus on navigation, drawer, outline, touch sizes, phone search
        run: pnpm test:docs:shell

      - name: Check that every docs link resolves
        run: pnpm check:docs:links

      - name: Check that no docs page loads the Monaco editor up front
        run: pnpm check:docs:editor-chunks

      - name: Install lychee (pinned release binary, checksum verified)
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
        run: |
          bin="$RUNNER_TEMP/lychee"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-musl.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$bin" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$bin" >> "$GITHUB_PATH"

      - name: Check that every external docs link resolves (lychee; bot-blocking hosts may answer 403 or 429)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @aziontech/webkit-docs run check:external-links

      - name: Build the demos
        run: pnpm build:demos

      - name: Lighthouse — accessibility 100, LCP at most 2.5 s, CLS at most 0.1, TBT at most 200 ms (docs home, one component page, one demo)
        env:
          LIGHTHOUSE_OUT: ${{ runner.temp }}/lighthouse
        run: pnpm --filter @aziontech/webkit-docs run check:lighthouse

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: ${{ runner.temp }}/lighthouse/
          retention-days: 7

      - name: Upload the built sites for the visual shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sites
          path: |
            apps/docs/dist/
            apps/demos/dist/
          retention-days: 3

  # Runs on every PR (no path filter): these gates are the machine half of the AI flow
  # (.claude/commands/component-new.md) and finish in under a minute. Locally:
  # pnpm --filter @aziontech/webkit run gates
  toolkit:
    name: Toolkit tests and catalog drift
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PR title is a valid Conventional Commit (the squash commit release-please reads)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Catalog is in sync (no drift from exports/specs)
        run: pnpm --filter @aziontech/webkit check:catalog

      - name: No spec in status draft (.specs/_template.md excepted)
        run: pnpm --filter @aziontech/webkit run check:spec-status

      - name: Spec integrity — every spec approved or beyond, shipped components implemented, body checksum matches
        run: pnpm --filter @aziontech/webkit run check:spec-integrity

      - name: Spec template — specs on template 2 fill Internationalization, Right-to-left, Responsive and Performance
        run: pnpm --filter @aziontech/webkit run check:spec-template

      - name: Blocks — every block has intents, real skills and a lint-clean SFC
        run: pnpm --filter @aziontech/webkit run check:blocks

      - name: Examples — every example passes the lint `webkit init` installs (strict preset), ratcheted by a baseline
        run: pnpm --filter @aziontech/webkit run check:examples-lint

      - name: Cited names — skills, rules and blocks only cite exports that exist
        run: pnpm --filter @aziontech/webkit run check:cited-names

      - name: Naming — kebab-case English ids, block ids match folders, no synonyms or retired v6 names
        run: pnpm --filter @aziontech/webkit run check:naming

      - name: Declarations for the runtime .js modules are in sync
        run: pnpm --filter @aziontech/webkit run check:js-dts

      - name: Every source export declares types (types condition into types/)
        run: pnpm --filter @aziontech/webkit run check:exports

      - name: Marketing and docs inventory — no marketing or docs item leaves unrecorded
        run: pnpm --filter @aziontech/webkit run check:marketing-inventory

      - name: Public API changes have a codemod entry (removed or renamed export, block, prop or value)
        run: pnpm --filter @aziontech/webkit run check:migrations

      - name: Public API diff against the base branch — breaking needs "!" in the PR title and a migration, any change bumps spec_version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm --filter @aziontech/webkit run check:api-diff

      - name: Hook tests (spec, authoring and reference hooks)
        run: pnpm --filter @aziontech/webkit run test:hooks

      - name: Build the icon font
        run: pnpm build:icons

      - name: Toolkit unit tests (ESLint rules, catalog queries, CLI, stylelint config)
        run: pnpm --filter @aziontech/webkit test:toolkit

      - name: MCP server tests (@aziontech/webkit-mcp over stdio)
        run: pnpm --filter @aziontech/webkit-mcp test

      - name: Theme tests (device contract, container scale in @theme, CSS types, shipped font files)
        run: pnpm --filter @aziontech/theme test

      - name: Icons package tests (published files, no runtime dependencies)
        run: pnpm --filter @aziontech/icons test

      - name: Icons manifest — every SVG documented, names follow the rules, ICONS.md current
        run: pnpm --filter @aziontech/icons check:manifest

      - name: Server rendering — every block and example renders with vue/server-renderer in Node
        run: pnpm --filter @aziontech/webkit test:ssr

      - name: Construction-standard ratchet (no new authoring violations)
        run: pnpm --filter @aziontech/webkit run check:authoring

      - name: Every component has its test (testing.md)
        run: pnpm --filter @aziontech/webkit run check:tests

      - name: Every component is complete — exports, -root, size budget, examples, visual baseline, spec status (ratcheted by a baseline)
        run: pnpm --filter @aziontech/webkit run check:complete

      - name: No new look-alike components — two components that do the same job without reusing each other (ratcheted by a baseline)
        run: pnpm --filter @aziontech/webkit run check:look-alikes

      - name: No copy-pasted code in components or inside a block (jscpd, no baseline)
        run: pnpm --filter @aziontech/webkit run check:duplication

      - name: Maintainability — no file, script block, function, line, prop or model count over the CODE_QUALITY.md 3.1 limits (no baseline)
        run: pnpm --filter @aziontech/webkit run check:maintainability

      - name: Type assertions — no as never or as unknown as, and the assertion count does not grow
        run: pnpm --filter @aziontech/webkit run check:assertions

      - name: Install typos (pinned release binary, checksum verified)
        env:
          TYPOS_VERSION: 1.52.2
          TYPOS_SHA256: 3b13d1291281d39d01822e54035636487a7a0f228e70097899b1e33aeb0e7e93
        run: |
          bin="$RUNNER_TEMP/typos"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/typos.tar.gz" "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $RUNNER_TEMP/typos.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$bin" ./typos
          echo "$bin" >> "$GITHUB_PATH"

      - name: Spelling — no spelling mistake in code, docs or identifiers (typos, words in _typos.toml)
        run: pnpm run check:spelling

      - name: Size budgets only ratchet down (each raised entry needs its own Budget-raise line)
        run: pnpm --filter @aziontech/webkit run check:size-ratchet
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Authoring docs ratchet (no new out-of-standard skill or agent docs)
        run: pnpm --filter @aziontech/webkit run check:authoring-docs

      - name: Docs Markdown — one Do / Don't vocabulary, no task list in a rendered page
        run: pnpm --filter @aziontech/webkit run check:docs-markdown

      - name: Docs Markdown pipeline tests (HTML comments dropped, task lists plain, pair words)
        run: pnpm test:docs

  smoke:
    name: Consumer smoke test (init and build)
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Init + build a bare consumer app
        run: pnpm --filter @aziontech/webkit run test:consume

  consumer-types:
    name: Consumer TypeScript build (fresh vue-ts app, packed tarballs)
    needs: changes
    if: needs.changes.outputs.webkit == 'true' || needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack, install into a fresh vue-ts app, run its npm run build
        run: pnpm --filter @aziontech/webkit run check:consumer-types

  tests:
    name: Vitest browser (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [changes, lint, types]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/webkit

      - name: Build the icon font
        run: pnpm build:icons

      - name: Run tests (shard ${{ matrix.shard }})
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4
        working-directory: packages/webkit

  visual:
    name: Visual tests, styled (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [changes, security, lint-canaries, lint, types, build, site, tests]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.visual == 'true' }}
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the built sites
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sites
          path: apps

      - name: Run visual tests (shard ${{ matrix.shard }}/4)
        run: pnpm --filter @aziontech/webkit-visual exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload the report on failure or when baselines change
        id: report
        if: ${{ failure() || needs.changes.outputs.baselines == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-report-shard-${{ matrix.shard }}
          path: |
            apps/visual/playwright-report/
            apps/visual/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Link the report in the job summary
        if: failure()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "### Visual diffs, shard ${SHARD}/4"
            echo ""
            if [ -n "$REPORT_URL" ]; then
              echo "Playwright report with the expected, actual and diff images: [visual-report-shard-${SHARD}](${REPORT_URL})."
            else
              echo "No report was uploaded; read the job log."
            fi
            echo "Download it, unzip, and run \`npx playwright show-report playwright-report\` (or open \`playwright-report/index.html\`)."
            echo "An intended change: regenerate the baselines with the \`baselines-regenerate\` skill."
          } >> "$GITHUB_STEP_SUMMARY"

  visual-review:
    name: Visual baseline review
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.baselines == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Build the before/after page
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          mkdir -p "$RUNNER_TEMP/before"
          git archive "$base" apps/visual/baselines | tar -x -C "$RUNNER_TEMP/before" || true
          node apps/visual/scripts/review-baselines.mjs \
            --before "$RUNNER_TEMP/before/apps/visual/baselines" \
            --after apps/visual/baselines \
            --out "$REVIEW_DIR" \
            --title "Visual baselines changed by this pull request"

      - name: Upload the review page
        id: review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline-review
          path: ${{ runner.temp }}/review/
          retention-days: 14

      - name: Link the review page in the job summary
        env:
          REVIEW_URL: ${{ steps.review.outputs.artifact-url }}
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          {
            echo "### Visual baselines changed by this pull request"
            echo ""
            echo "Review page (before and after, side by side): [visual-baseline-review](${REVIEW_URL}). Download it, unzip, and open \`index.html\`."
            echo ""
            cat "$REVIEW_DIR/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

  gates:
    name: Governance Gate
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        security,
        security-suite,
        lint-canaries,
        lint,
        types,
        build,
        site,
        toolkit,
        smoke,
        consumer-types,
        tests,
        visual,
        visual-review
      ]
    if: always()
    steps:
      - name: Check all jobs passed or skipped
        run: |
          declare -A results=(
            [changes]="${{ needs.changes.result }}"
            [security]="${{ needs.security.result }}"
            [security-suite]="${{ needs.security-suite.result }}"
            [lint-canaries]="${{ needs.lint-canaries.result }}"
            [lint]="${{ needs.lint.result }}"
            [types]="${{ needs.types.result }}"
            [build]="${{ needs.build.result }}"
            [site]="${{ needs.site.result }}"
            [toolkit]="${{ needs.toolkit.result }}"
            [smoke]="${{ needs.smoke.result }}"
            [consumer-types]="${{ needs.consumer-types.result }}"
            [tests]="${{ needs.tests.result }}"
            [visual]="${{ needs.visual.result }}"
            [visual-review]="${{ needs.visual-review.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ $job: $result"
              failed=1
            else
              echo "✅ $job: $result"
            fi
          done
          if [[ $failed -eq 1 ]]; then
            echo "Governance checks failed"
            exit 1
          fi
          echo "All governance checks passed or were cleanly skipped"
