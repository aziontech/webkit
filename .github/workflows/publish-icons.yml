name: Publish @aziontech/icons to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. @aziontech/icons@5.0.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-icons
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan, sign and publish to npm
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, '@aziontech/icons@'))
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/@aziontech/icons@')))
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-package.yml # zizmor: ignore[self-repository] GitHub documents ./ for a reusable workflow in jobs.<id>.uses
    with:
      package: '@aziontech/icons'
      directory: packages/icons
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      build: node scripts/build-icons.mjs
