name: Publish @aziontech/theme to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. @aziontech/theme@6.0.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-theme
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan, sign and publish to npm
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, '@aziontech/theme@'))
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/@aziontech/theme@')))
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-package.yml # zizmor: ignore[self-repository] GitHub documents ./ for a reusable workflow in jobs.<id>.uses
    with:
      package: '@aziontech/theme'
      directory: packages/theme
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      build: pnpm exec vue-tsc --declaration --emitDeclarationOnly
