name: Publish @aziontech/webkit-mcp to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. @aziontech/webkit-mcp@6.0.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-webkit-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan, sign and publish to npm
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, '@aziontech/webkit-mcp@'))
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/@aziontech/webkit-mcp@')))
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-package.yml # zizmor: ignore[self-repository] GitHub documents ./ for a reusable workflow in jobs.<id>.uses
    with:
      package: '@aziontech/webkit-mcp'
      directory: packages/webkit-mcp
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      test: pnpm test
