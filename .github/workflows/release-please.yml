name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR and cut releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      # Maintains the single Release PR (version bumps + changelogs) while
      # features land on main; when that PR merges, this same job creates the
      # per-package tags and GitHub Releases.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Releases created with `github.token` do not fire a `release: published`
      # event that other workflows can react to — GitHub suppresses events
      # produced by the default token to prevent recursive runs. workflow_dispatch
      # is exempt from that rule, so dispatch each package's publish workflow
      # explicitly instead of relying on `release: published`.
      - name: Dispatch publish workflows for released packages
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo, so `gh` cannot infer it from a
          # git remote — name it explicitly.
          GH_REPO: ${{ github.repository }}
          WEBKIT_RELEASED: ${{ steps.release.outputs['packages/webkit--release_created'] }}
          WEBKIT_TAG: ${{ steps.release.outputs['packages/webkit--tag_name'] }}
          THEME_RELEASED: ${{ steps.release.outputs['packages/theme--release_created'] }}
          THEME_TAG: ${{ steps.release.outputs['packages/theme--tag_name'] }}
          ICONS_RELEASED: ${{ steps.release.outputs['packages/icons--release_created'] }}
          ICONS_TAG: ${{ steps.release.outputs['packages/icons--tag_name'] }}
          WEBKIT_MCP_RELEASED: ${{ steps.release.outputs['packages/webkit-mcp--release_created'] }}
          WEBKIT_MCP_TAG: ${{ steps.release.outputs['packages/webkit-mcp--tag_name'] }}
        run: |
          failed=0
          dispatch() {
            local workflow="$1" tag="$2"
            if ! gh workflow run "$workflow" --ref main -f tag="$tag"; then
              echo "::error::failed to dispatch $workflow for tag $tag"
              failed=1
            fi
          }

          [ "$WEBKIT_RELEASED" = "true" ] && dispatch publish-webkit.yml "$WEBKIT_TAG"
          [ "$THEME_RELEASED" = "true" ] && dispatch publish-theme.yml "$THEME_TAG"
          [ "$ICONS_RELEASED" = "true" ] && dispatch publish-icons.yml "$ICONS_TAG"
          [ "$WEBKIT_MCP_RELEASED" = "true" ] && dispatch publish-webkit-mcp.yml "$WEBKIT_MCP_TAG"

          exit "$failed"

      - name: Checkout the release commit (for the SBOMs)
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: steps.release.outputs.releases_created == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: '.nvmrc'

      - name: Attach a CycloneDX SBOM to each new release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WEBKIT_TAG: ${{ steps.release.outputs['packages/webkit--release_created'] == 'true' && steps.release.outputs['packages/webkit--tag_name'] || '' }}
          THEME_TAG: ${{ steps.release.outputs['packages/theme--release_created'] == 'true' && steps.release.outputs['packages/theme--tag_name'] || '' }}
          ICONS_TAG: ${{ steps.release.outputs['packages/icons--release_created'] == 'true' && steps.release.outputs['packages/icons--tag_name'] || '' }}
          WEBKIT_MCP_TAG: ${{ steps.release.outputs['packages/webkit-mcp--release_created'] == 'true' && steps.release.outputs['packages/webkit-mcp--tag_name'] || '' }}
        run: |
          pnpm run generate:sbom
          attach() {
            local tag="$1" file="$2"
            [ -n "$tag" ] || return 0
            cp "sbom/$file" "$RUNNER_TEMP/$file"
            gh release upload "$tag" "$RUNNER_TEMP/$file" --clobber
          }
          attach "$WEBKIT_TAG" aziontech-webkit.cdx.json
          attach "$THEME_TAG" aziontech-theme.cdx.json
          attach "$ICONS_TAG" aziontech-icons.cdx.json
          attach "$WEBKIT_MCP_TAG" aziontech-webkit-mcp.cdx.json
