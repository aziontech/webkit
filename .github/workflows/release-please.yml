name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR and cut releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      # Maintains the single Release PR (one version for the four packages,
      # the root CHANGELOG.md) while features land on main; when that PR
      # merges, this same job creates the vX.Y.Z tag and its GitHub Release.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Releases created with `github.token` do not fire a `release: published`
      # event that other workflows can react to — GitHub suppresses events
      # produced by the default token to prevent recursive runs. workflow_dispatch
      # is exempt from that rule, so dispatch the four publish workflows
      # explicitly instead of relying on `release: published`.
      - name: Dispatch the four publish workflows for the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repo, so `gh` cannot infer it from a
          # git remote — name it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          failed=0
          for workflow in publish-webkit.yml publish-theme.yml publish-icons.yml publish-webkit-mcp.yml; do
            if ! gh workflow run "$workflow" --ref main -f tag="$TAG"; then
              echo "::error::failed to dispatch $workflow for tag $TAG"
              failed=1
            fi
          done
          exit "$failed"
