# The hosts lychee.toml leaves out: each blocks automated clients, so a 403 or 429 from it
# says nothing about the page. A 404, a 5xx or a failed connection still fails the check.
# Run: pnpm --filter @aziontech/ui-docs run check:external-links after pnpm build:docs.

scheme = ["https"]
max_concurrency = 2
max_retries = 2
retry_wait_time = 5
timeout = 30
accept = ["200..=299", "403", "429", "999"]
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"

exclude = ['.*']
include = [
  # npm answers 403 to every request without a browser challenge (Cloudflare).
  '^https://(www\.)?npmjs\.com/',
  # Reddit answers 403 to clients it does not recognise as a browser.
  '^https://(www\.)?reddit\.com/',
  # Instagram redirects to its login page and answers 429 to automated clients.
  '^https://(www\.)?instagram\.com/',
  # X answers 403 to every client that is not a signed-in browser.
  '^https://(www\.)?x\.com/',
  # The W3C answers 403 to automated clients on some paths (its favicon among them).
  '^https://(www\.)?w3\.org/',
  # LinkedIn answers 403 or 999 to automated clients.
  '^https://(www\.)?linkedin\.com/',
]
