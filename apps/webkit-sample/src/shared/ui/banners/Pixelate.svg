<svg width="15" height="15" viewBox="0 0 15 15" xmlns="http://www.w3.org/2000/svg">
  <title>Pixelate grid cell</title>
  <!-- One cell of the pixelate grid: a 5px square on a 15px pitch, measured off
       the Figma frame. Tiled as a CSS mask by PixelateBanner.vue, which is where
       the full rationale lives. Only the alpha channel is read - the colour
       comes from the gradients underneath. Keep this file terse: Vite inlines it
       as a data URI, so every byte here ships in the stylesheet. -->
  <rect x="5" y="5" width="5" height="5" fill="#000000" />
</svg>
