packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  # Native binary ships via the platform optionalDep (@swc/core-<platform>);
  # the build script is only a download fallback — not needed.
  '@swc/core': false
  es5-ext: false
  esbuild: false
  ttf2woff2: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@aziontech/theme@4.0.0'

packageExtensions:
  # tailwind-gradient-mask-image does `require('tailwindcss/plugin')` but declares no
  # dependency or peer on tailwindcss. Under pnpm's isolated layout it resolves from the
  # virtual store, so it can only find tailwindcss if the ROOT package.json happens to
  # declare it — an invisible coupling that broke the icons-gallery build when the dead
  # root Tailwind v3 entries were removed. Declaring the missing peer lets pnpm link
  # tailwindcss (owned by apps/icons-gallery) into the plugin's own store directory, so
  # the only Tailwind v3 declaration lives in the one app that still uses v3.
  tailwind-gradient-mask-image:
    peerDependencies:
      tailwindcss: '*'

overrides:
  # Minimal validated set (2026-07-25): each entry guards a live advisory or a
  # proven resolution hazard; the tree is audit-clean without anything else.
  brace-expansion: ">=5.0.9" # GHSA-rgw5-rvv9-x895 (DoS, CVE-2026-14257 mitigation bypass), patched 5.0.9 — supersedes GHSA-mh99-v99m-4gvg
  minimatch: ">=9.0.0" # keeps minimatch@3 chains out so the brace-expansion force stays within one API major
  uuid: ">=14.0.0" # GHSA-w5hq-g745-h8pq, patched 11.1.1; jest/storybook chains pin 8.x/9.x
  fast-uri: ">=3.1.5 <4" # GHSA-7p8r-x3mc-p8w7 (host confusion via backslash), patched 3.1.5; bounded to 3.x — ajv pins ^3
  "@babel/core": ">=7.29.1 <8" # bounded: peer ranges (^7 || ^8.0.0-0) would jump to Babel 8
  "@hono/node-server": ">=2.0.5" # GHSA-frvp-7c67-39w9; MCP SDK still pins ^1.19.x — drop when the SDK moves to ^2
  hono: ">=4.12.34 <5" # GHSA-8j4g-w8fx-2239 (ReDoS in CORS middleware), patched 4.12.34; bounded to 4.x — MCP SDK pins ^4
  "js-yaml@3": ">=3.15.1 <4" # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870, quadratic CPU in !!omap), patched 3.15.1; bounded — 4.x removed the legacy safeLoad API
  "js-yaml@4": ">=4.3.1 <5" # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870), patched 4.3.1; bounded to 4.x — 5.x is ESM-only
