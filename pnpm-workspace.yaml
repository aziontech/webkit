packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  es5-ext: false
  esbuild: false
  ttf2woff2: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@aziontech/theme@4.0.0'

overrides:
  brace-expansion: ">=5.0.12"
  minimatch: ">=11.0.1 <12"
  "glob@>=9": ">=14.0.2 <15"
  uuid: ">=14.0.0"
  fast-uri: ">=3.1.9 <4"
  qs: ">=6.16.1 <7"
  "@xmldom/xmldom": ">=0.9.12 <0.10"
  "@babel/core": ">=7.29.1 <8"
  "@hono/node-server": ">=2.1.6 <3"
  hono: ">=4.13.16 <5"
  "js-yaml@3": ">=3.15.2 <4"
  "js-yaml@4": ">=4.3.2 <5"
  "nanoid@3": ">=3.3.17 <4"
  colord: ">=2.9.4 <3"
  dompurify: ">=3.4.17 <4"
  axios: ">=1.20.0 <2"
  follow-redirects: ">=1.16.2 <2"
  undici: ">=7.30.1 <8"
  ip-address: ">=10.7.4 <11"
  vitest: ">=4.1.12 <5"
  "@figma/code-connect>zod": ">=4.6.6 <5"
  "@figma/code-connect>zod-validation-error": ">=4.0.2 <5"
  body-parser: ">=2.4.0 <3"
  "@vitest/mocker": ">=4.1.12 <5"
  http-cache-semantics: ">=4.3.0 <5"
  proxy-addr: ">=2.0.8 <3"
  shell-quote: ">=1.11.0 <2"
  source-map-js: ">=1.2.2 <2"
  postcss-selector-parser: ">=7.1.6 <8"
  handlebars: ">=4.7.10 <5"
  vue: ">=3.5.42 <4"
  "joi@17": ">=17.13.9 <18"
  "joi@18": ">=18.3.1 <19"

auditConfig:
  # Each ignored advisory names its package, why it is ignored and the date to review it by;
  # packages/ui/test/standards/supply-chain.test.mjs fails once a date has passed.
  ignoreGhsas:
    # braces <= 3.0.3, dev-only (build tooling); withdrawn by GitHub. Review by 2027-02-24.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js <= 1.1.3, dev-only; withdrawn by GitHub. Review by 2027-02-24.
    - GHSA-hp3w-g68c-fv3c
    # deepmerge 4.2.0 to 4.3.1, dev-only; withdrawn by GitHub. Review by 2027-02-24.
    - GHSA-gcqx-w48m-w2h4
    # picomatch <= 4.0.7, dev-only (build tooling); withdrawn by GitHub. Review by 2027-02-24.
    - GHSA-fc5q-39xc-vjpf
