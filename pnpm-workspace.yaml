packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  es5-ext: false
  esbuild: false
  ttf2woff2: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@aziontech/theme@4.0.0'

overrides:
  brace-expansion: ">=5.0.12"
  minimatch: ">=9.0.0"
  uuid: ">=14.0.0"
  fast-uri: ">=3.1.9 <4"
  qs: ">=6.16.1 <7"
  "@xmldom/xmldom": ">=0.9.12 <0.10"
  "@babel/core": ">=7.29.1 <8"
  "@hono/node-server": ">=2.1.3"
  hono: ">=4.13.11 <5"
  "js-yaml@3": ">=3.15.2 <4"
  "js-yaml@4": ">=4.3.2 <5"
  "nanoid@3": ">=3.3.17 <4"
  colord: ">=2.9.4 <3"
  axios: ">=1.20.0 <2"
  follow-redirects: ">=1.16.1 <2"
  undici: ">=7.30.1 <8"
  ip-address: ">=10.7.4 <11"
  vitest: ">=4.1.12 <5"
  "@figma/code-connect>zod": ">=4.6.6 <5"
  "@figma/code-connect>zod-validation-error": ">=4.0.2 <5"
  body-parser: ">=2.4.0 <3"
  "@vitest/mocker": ">=4.1.12 <5"
  http-cache-semantics: ">=4.3.0 <5"
  proxy-addr: ">=2.0.8 <3"
  shell-quote: ">=1.11.0 <2"
  source-map-js: ">=1.2.2 <2"
  postcss-selector-parser: ">=7.1.6 <8"
  handlebars: ">=4.7.10 <5"
  vue: ">=3.5.42 <4"
  "joi@17": ">=17.13.8 <18"
  "joi@18": ">=18.2.9 <19"

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c
    - GHSA-gcqx-w48m-w2h4
